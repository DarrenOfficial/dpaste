name: Python CI

on:
  push:
    branches:
      - 'master'
      - 'v4'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: '3.10', django: '5.2' }
          - { python: '3.12', django: '5.2' }
          - { python: '3.12', django: '6.0' }
          - { python: '3.13', django: '6.1' }
          - { python: '3.14', django: '6.1' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build staticfiles
        run: |
          npm ci --ignore-scripts
          mkdir -p dpaste/static
          make css js

      - name: Install dpaste
        run: pip install -e .[test] "django~=${{ matrix.django }}.0"

      - name: Run tests
        run: pytest dpaste
